<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teri's Personal Data Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Teri's Personal Data Dashboard</h1>
        <button type="button" id="theme-toggle">Toggle dark mode</button>
    </header>

    <main>
        <section class="widget">
            <h2>Sample Weather</h2>

            <div id="weather-display" class="loading" role="status" aria-live="polite">
                Loading weather...
            </div>

        </section>
        <section class="widget">
            <h2>Daily Quote</h2>

            <div id="quote-display" class="loading" role="status" aria-live="polite">
                Loading quotes...
            </div>

            <button type="button" id="new-quote" disabled>New Quote</button>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
